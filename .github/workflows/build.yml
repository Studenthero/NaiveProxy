name: Build NaiveProxy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          xcaddy build --with github.com/caddyserver/forwardproxy=github.com/klzgrad/forwardproxy@naive

      - name: Get Caddy version
        id: ver
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          echo "tag=$(./caddy version | head -1)" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: NaiveProxy ${{ steps.ver.outputs.tag }}
          files: caddy   
